<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117 167" width="117" height="167">
  <!-- Padlock body, vector redraw of the engraved front-on drawing. Same
       117 x 167 frame as the shackle; the keyhole's round top is at
       (57.5, 137.5) and the shackle pivots at (88.5, 57). -->
  <defs>
    <path
      id="outline"
      d="M 12 76 C 10 62 20 56.5 29 56.5 C 38 56.5 45 61 46 70 L 46 73 Q 46 75 48 75 L 69 75 Q 71 75 71 73 L 71 70 C 72 61 79 56.5 88 56.5 C 97 56.5 107 62 105 76 C 108 84 108 95 107.5 104 C 107 140 88 164 58.5 164 C 29 164 10 140 9.5 104 C 9 95 9 84 12 76 Z"
    />
    <clipPath id="inside">
      <use href="#outline" transform="translate(58.5 110) scale(0.93) translate(-58.5 -110)" />
    </clipPath>

    <!-- engraved scrollwork, tiled -->
    <pattern id="scroll" width="9" height="7" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#4e4853" stroke-width="0.46" stroke-linecap="round">
        <path d="M 0.8 5.6 C 0.8 2.6 4.3 2.4 4.3 4.3 C 4.3 5.5 2.7 5.6 2.6 4.5" />
        <path d="M 4.9 1.2 C 7.8 1.2 8.1 4.2 6.3 4.4 C 5.4 4.5 5.2 3.4 5.9 3.1" />
        <path d="M 4.6 6.4 C 5.8 5.6 7.4 5.7 8.4 6.5" />
        <circle cx="7.9" cy="2.2" r="0.35" fill="#5a545f" stroke="none" />
      </g>
    </pattern>
    <pattern id="scroll-fine" width="7" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <g fill="none" stroke="#6a6470" stroke-width="0.32" stroke-linecap="round">
        <path d="M 0.6 4.6 C 0.6 2.2 3.5 2.1 3.5 3.6 C 3.5 4.6 2.2 4.6 2.2 3.8" />
        <path d="M 3.9 1 C 6.2 1 6.4 3.4 5 3.6" />
      </g>
    </pattern>

    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#efedf2" />
    </linearGradient>
  </defs>

  <g stroke="#433e45" stroke-linejoin="round" stroke-linecap="round">
    <!-- body and its inner rim -->
    <use href="#outline" fill="url(#face)" stroke-width="1.6" />
    <use
      href="#outline"
      fill="none"
      stroke-width="0.6"
      transform="translate(58.5 110) scale(0.93) translate(-58.5 -110)"
    />

    <!-- engraving, kept inside the rim -->
    <g clip-path="url(#inside)" stroke="none">
      <rect x="0" y="50" width="117" height="42" fill="url(#scroll-fine)" opacity="0.85" />
      <rect x="0" y="94" width="117" height="25" fill="url(#scroll)" />
      <rect x="0" y="122" width="117" height="45" fill="url(#scroll-fine)" opacity="0.85" />
    </g>

    <!-- the two bands across the face -->
    <g clip-path="url(#inside)" fill="none">
      <path d="M 0 91.6 H 117" stroke-width="0.9" />
      <path d="M 0 93.8 H 117" stroke-width="0.5" />
      <path d="M 0 119.6 H 117" stroke-width="0.9" />
      <path d="M 0 121.8 H 117" stroke-width="0.5" />
    </g>

    <!-- the lower panel: a roof-shaped keyhole plate between two diagonals -->
    <g clip-path="url(#inside)">
      <path d="M 0 164 V 151 L 18 151 L 48.8 128.8 V 167 H 0 Z" fill="#e9e6ee" stroke="none" opacity="0.55" />
      <path d="M 18 151 L 48.8 128.8 H 66.2 L 97 151" fill="none" stroke-width="0.8" />
      <path d="M 48.8 128.8 V 167 M 66.2 128.8 V 167" fill="none" stroke-width="0.8" />
      <path d="M 49.2 129.2 H 65.8 V 167 H 49.2 Z" fill="#fbfafc" stroke="none" />
    </g>

    <!-- keyhole -->
    <path
      d="M 57.5 134.1 A 3.4 3.4 0 0 1 59.5 140.2 L 60.4 153 H 54.6 L 55.5 140.2 A 3.4 3.4 0 0 1 57.5 134.1 Z"
      fill="#2c282f"
      stroke-width="0.6"
    />

    <!-- rivets -->
    <g fill="#ffffff">
      <circle cx="29.6" cy="70.6" r="4.4" stroke-width="1" />
      <circle cx="29.6" cy="70.6" r="2.4" stroke-width="0.6" fill="#f2f0f4" />
      <circle cx="87.5" cy="70.6" r="4.4" stroke-width="1" />
      <circle cx="87.5" cy="70.6" r="2.4" stroke-width="0.6" fill="#f2f0f4" />
      <circle cx="58.5" cy="81" r="2.9" stroke-width="0.9" />
      <circle cx="20" cy="87.5" r="2.6" stroke-width="0.9" />
      <circle cx="96.8" cy="87.5" r="2.6" stroke-width="0.9" />
      <circle cx="23.7" cy="138" r="3.2" stroke-width="0.9" />
      <circle cx="23.7" cy="138" r="1.6" stroke-width="0.5" fill="#f2f0f4" />
      <circle cx="93" cy="138" r="3.2" stroke-width="0.9" />
      <circle cx="93" cy="138" r="1.6" stroke-width="0.5" fill="#f2f0f4" />
    </g>

    <!-- the keyhole cover, swung aside on its pivot -->
    <g transform="translate(58.1 123.1) rotate(45)">
      <rect x="-6.4" y="-6.4" width="41.5" height="12.8" rx="6.4" fill="#ffffff" stroke-width="1.1" />
      <rect x="-4.6" y="-4.6" width="37.9" height="9.2" rx="4.6" fill="none" stroke-width="0.45" opacity="0.8" />
      <circle r="3" fill="#f6f5f8" stroke-width="0.9" />
      <circle r="1.3" fill="none" stroke-width="0.5" />
      <!-- small key engraved on the cover -->
      <circle cx="16" cy="0" r="1.9" fill="none" stroke-width="0.65" />
      <path d="M 17.9 0 H 29 M 26 0 V 2 M 28 0 V 1.6" fill="none" stroke-width="0.65" />
      <path d="M 10 -3.2 H 31 M 10 3.2 H 31" fill="none" stroke="#8d8793" stroke-width="0.35" />
    </g>
  </g>
</svg>
