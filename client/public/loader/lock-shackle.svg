<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117 167" width="117" height="167">
  <!-- Padlock shackle, drawn in the same 117 x 167 frame as the body so the
       two layers line up. The legs run down behind the body. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e6ee" />
      <stop offset="0.35" stop-color="#ffffff" />
      <stop offset="0.7" stop-color="#f3f1f6" />
      <stop offset="1" stop-color="#dcd8e2" />
    </linearGradient>
  </defs>
  <g stroke="#433e45" stroke-linejoin="round" stroke-linecap="round">
    <!-- the bar: outer arch r 35.75, inner r 22, centre (58.25, 47.75) -->
    <path
      d="M 22.5 72 V 47.75 A 35.75 35.75 0 0 1 94 47.75 V 72 H 80.25 V 47.75 A 22 22 0 0 0 36.25 47.75 V 72 Z"
      fill="url(#steel)"
      stroke-width="1.5"
    />
    <!-- engraved groove along the middle of the bar -->
    <path d="M 29.4 72 V 47.75 A 28.85 28.85 0 0 1 87.1 47.75 V 72" fill="none" stroke-width="0.55" opacity="0.7" />
    <!-- a finer highlight line toward the inside edge -->
    <path d="M 33.4 72 V 47.75 A 24.85 24.85 0 0 1 83.1 47.75 V 72" fill="none" stroke="#8d8793" stroke-width="0.35" opacity="0.8" />
  </g>
</svg>
