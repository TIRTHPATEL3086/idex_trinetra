<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provenance — Decryption Register</title>
    <meta
      name="description"
      content="SIH26237 — invisible watermarking plus blockchain-anchored decryption receipts."
    />
    <!-- The app mark for the tab and the iOS home screen, the same artwork
         cropped from the supplied logo. Declaring these stops the browser
         guessing at /favicon.ico. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f1a23" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces carries the display type, matching the heavy, soft-serifed
         headlines of the Chromia reference. Inter runs the interface, Sniglet
         the wordmark, and JetBrains Mono the hashes and small labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Comfortaa:wght@700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- The wordmark is requested separately with `display=block` rather than
         `swap`. Swap is right for body text — show something immediately,
         correct it when the font lands — but on a logo that reads as the brand
         briefly rendering in the wrong typeface. Block holds the glyphs
         invisible for a moment instead, so the mark only ever appears once,
         correctly. It is four short words, so nothing is kept from the reader. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sniglet:wght@800&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
